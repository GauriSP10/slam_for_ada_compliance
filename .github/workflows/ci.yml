name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The headless OpenCV build needs no system GUI libraries. The heavy Tier 2 packages (torch, transformers,
      # onnxruntime, ultralytics) are deliberately NOT installed: they are imported lazily, and the tests use fakes
      # for the models, so CI also proves the core package works without them.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python-headless pyyaml rosbags matplotlib pytest ruff pyright
          pip install -e . --no-deps

      - name: Lint
        run: ruff check src scripts tests

      - name: Format
        run: ruff format --check src scripts tests

      - name: Type check
        run: pyright --pythonpath "$(which python)"

      - name: Test
        run: pytest -q
