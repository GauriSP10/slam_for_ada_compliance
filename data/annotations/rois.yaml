# Where each ground-truth feature appears, as pixels on the cam0 UNDISTORTED image (the same grid as every depth map).
# Read off with scripts/annotate_view.py. Placements need only be rough: jamb lines snap to the nearest vertical edge.
#
# Fields common to every entry
#   id          unique observation id
#   feature_id  ground-truth id (data/ground_truth/ground_truth.yaml)
#   kind        FeatureKind value
#   bag         bag file name suffix (e.g. "32" -> 2023-03-14-12-13-30_32)
#   key         keyframe number inside that bag (data/cache/frames/<bag>/index.json)
#   note        what exactly the pixels mark
#
# Geometry by kind
#   door_width      left_jamb / right_jamb: [[x_top, y_top], [x_bottom, y_bottom]];  wall_rois: boxes on the door leaf [x0,y0,x1,y1]
#   *_height        point_px: [x, y] the point whose height is measured;  depth_roi: box on the same surface used for range
#   hallway_width   left_wall_roi / right_wall_roi: boxes on the walls;  floor_contacts: {left: [[x,y],...], right: [[x,y],...]}
#   protrusion      wall_roi: box on the wall beside the object;  object_roi: box on the front of the object
#
# Measurement bases assumed (see ground_truth.yaml): door width = full opening, frame to frame;
# hardware = centre of the handle; operable parts = centre of the device; outlet = TOP of the plate; handrail = top of the rail.

annotations:
  # ----------------------------------------------------------------- teal entrance door, thermostat, outlet (bag 32, key 4)
