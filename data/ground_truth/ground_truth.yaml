# Tape-measure ground truth, ISEC 4th floor.  UNITS: INCHES.
# Source: four handwritten cards, IMG_3488 .. IMG_3491 (the photos are kept local, not in the repo).
# Transcribed from the photos; every value has been confirmed by the team.
#
# Fields
#   id          unique, snake_case; Measurement.feature_id refers to this
#   kind        one of FeatureKind in src/slam_for_ada/datatypes.py (the enum value strings)
#   value_in    tape-measured value, inches, exactly as written on the card
#   confirmed   false = the reading of the handwriting is uncertain; team must confirm
#   photo       which card it came from
#   bags        which bag(s) the feature is visible in. Left empty until the frame
#               index has been built.  Empty means "not yet checked", NOT "invisible".
#   note        anything a reader should know
#
# Items on the checklist card (IMG_3489) with NO value written, so no entry here:
#   elevator dimensions, elevator button height, turning space, protruding items (other than
#   the water fountain), tables/chairs/bins/card readers other than those listed below.
#
# Kinds with no ADA rule in this project (error is still scored, pass/fail is not):
#   object_height, hallway_length.
#
# Measurement bases confirmed by the team:
#   door widths        = full OPENING (frame to frame), NOT ADA clear width (which is smaller)
#   signage_electrical_room = baseline of the highest tactile character (the basis the ADA 60 in limit uses)
#   water fountain lowest front edge is above 27 in, so the 4 in protrusion limit applies

features:
  # ---------------------------------------------------------------- doors
  - id: door_entrance_width
    kind: door_width
    value_in: 35
    confirmed: true
    photo: IMG_3488
    bags: ["2023-03-14-12-13-30_32"]
    note: "Card says 'Door length' (meaning width). Last digit was overwritten; team confirmed 35 (not 34.5). Measured as the full opening (frame to frame), not clear width."

  - id: door_interior_width
    kind: door_width
    value_in: 35.6
    confirmed: true
    photo: IMG_3490
    bags: ["2023-03-14-12-13-30_32", "2023-03-14-12-14-02_33"]
    note: "Struck-out 36, corrected to 35.6. A stray mark under it looks like '3C' and is treated as an artefact. Measured as the full opening (frame to frame), not clear width."

  - id: door_bathroom_width
    kind: door_width
    value_in: 37
    confirmed: true
    photo: IMG_3490
    bags: []
    note: "Measured as the full opening (frame to frame), not clear width."

